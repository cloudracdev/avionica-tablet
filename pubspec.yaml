name: qfly_avionica
description: Sistema de telemetria de voo para instrução aeronáutica
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🎨 UI/UX
  cupertino_icons: ^1.0.6
  
  # 🔄 State Management
  flutter_riverpod: ^2.4.9
  
  # 🌐 Network
  web_socket_channel: ^2.4.0
  http: ^1.1.2
  
  # 📊 Data
  shared_preferences: ^2.2.2
  sqflite: ^2.4.2
  path: ^1.9.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.10.3
  go_router: ^17.0.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # 🧪 Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7
  test: ^1.24.9
  
  # 📈 Coverage
  coverage: ^1.7.2
  
  # 🎯 Lint
  very_good_analysis: ^5.1.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - .env