name: qfly_avionica
description: Sistema de telemetria para instrução de voo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 🎯 State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # 🔌 Network & WebSocket
  web_socket_channel: ^2.4.0
  
  # 📱 UI & Utils
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # 🔧 Code Generation (para Riverpod)
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true